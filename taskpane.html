<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: Segoe UI, sans-serif; padding: 16px; }
    h2 { color: #0078d4; }
    textarea { width: 100%; height: 180px; padding: 8px; font-size: 14px; box-sizing: border-box; }
    button { margin-top: 8px; padding: 8px 16px; background: #0078d4; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 8px; }
    button.del { background: #c00; }
    #status { margin-top: 8px; color: green; font-size: 13px; }
  </style>
</head>
<body>
  <h2>📝 Meine Notiz</h2>
  <textarea id="note" placeholder="Notiz zu dieser Mail..."></textarea>
  <br>
  <button onclick="saveNote()">💾 Speichern</button>
  <button class="del" onclick="deleteNote()">🗑️ Löschen</button>
  <div id="status"></div>
  <script>
    Office.onReady(function() { loadNote(); });

    function loadNote() {
      Office.context.mailbox.item.loadCustomPropertiesAsync(function(r) {
        if (r.status === Office.AsyncResultStatus.Succeeded) {
          document.getElementById("note").value = r.value.get("privateNote") || "";
        }
      });
    }

    function saveNote() {
      Office.context.mailbox.item.loadCustomPropertiesAsync(function(r) {
        if (r.status === Office.AsyncResultStatus.Succeeded) {
          r.value.set("privateNote", document.getElementById("note").value);
          r.value.saveAsync(function() { showStatus("✅ Gespeichert!"); });
        }
      });
    }

    function deleteNote() {
      Office.context.mailbox.item.loadCustomPropertiesAsync(function(r) {
        if (r.status === Office.AsyncResultStatus.Succeeded) {
          r.value.remove("privateNote");
          r.value.saveAsync(function() {
            document.getElementById("note").value = "";
            showStatus("🗑️ Gelöscht.");
          });
        }
      });
    }

    function showStatus(msg) {
      var el = document.getElementById("status");
      el.textContent = msg;
      setTimeout(function() { el.textContent = ""; }, 3000);
    }
  </script>
</body>
</html>
